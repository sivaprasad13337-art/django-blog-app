{% extends 'layouts/base.html' %} {% block body%}

<style>
  .login-form {
    /* background-color: aqua; */
    width: 40%;
    min-height: 76.6vh;
    margin: 1rem auto;
    /* margin-bottom: 5rem; */
    position: relative;
  }

  .login-form label {
    display: block;
    margin-bottom: 0.8rem;
    margin-top: 2rem;
    font-weight: bold;
  }

  .login-form input {
    /* background-color: aqua; */
    display: block;
    width: 100%;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px rgb(87, 84, 84) solid;
  }

  .login-form button {
    background-color: rgb(0, 0, 0);
    margin-top: 1rem;
    /* position: absolute; */
    /* right: 0; */
    padding: 0.8rem 5rem;
    color: aliceblue;
    font-weight: 600;
    border-radius: 10px;
  }

  .login-form p {
    margin-top: 2rem;
  }

  .login-form a:hover {
    color: rgb(82, 84, 84);
  }
</style>
<form action="" method="post" class="login-form">
  {% csrf_token %}

  <div>
    <h2>{{error}}</h2>
    <br />
  </div>

  <div>
    <label for="username">User Name</label>
    <input type="text" name="username" required />
  </div>

  <div>
    <label for="pwd">Password</label>
    <input type="text" name="password" required />
    <a href="{% url 'Password-Reset' %}" class="text-sm font-semibold">Forgot Password?</a>
  </div>

  <div class="flex justify-between">
    <p>
      Don't have an account?
      <a href="{% url 'Register-User' %}" class="font-semibold"> Register</a>
    </p>

    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>
{% endblock %}
