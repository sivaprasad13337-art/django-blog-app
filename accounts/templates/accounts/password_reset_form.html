{% extends 'layouts/base.html' %} {% block title %}Forgot Your
Password?{%endblock %} {% block body %}

<style>
  .pwd-reset label {
    display: block;
    margin-bottom: 0.8rem;
    margin-top: 2rem;
    font-weight: bold;
  }

  .pwd-reset input {
    /* background-color: aqua; */
    display: block;
    width: 100%;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px rgb(87, 84, 84) solid;
  }

  .pwd-reset button {
    background-color: rgb(0, 0, 0);
    margin-top: 1rem;
    /* position: absolute; */
    /* right: 0; */
    padding: 0.8rem 3rem;
    color: aliceblue;
    font-weight: 600;
    border-radius: 10px;
    display: block;
  }

  .pwd-reset {
    height: 83vh;
    /* background-color: rgb(83, 89, 89); */
    display: flex;
    justify-content: center;
  }

  .pwd-reset p {
    font-size: 1.2rem;
    color: rgb(75, 75, 73);
    margin: 1rem 0;
  }

  .pwd-reset h1 {
    font-weight: bold;
    font-size: 2.5rem;
  }
</style>
<div class="pwd-reset">
  <div>
    <h1>Forgot your password?</h1>
    <p>
      Enter your email address below, and we'll email instructions for setting a
      new one.
    </p>

    <form method="POST">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Send me instructions!</button>
    </form>
  </div>
</div>
{% endblock %}
