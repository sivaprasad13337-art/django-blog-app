{% extends 'layouts/base.html' %}{% block body %}

<style>
  .edit-profile input {
    /* background-color: aqua; */
    display: block;
    width: 100%;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 1px rgb(87, 84, 84) solid;
  }

  .edit-profile label {
    font-weight: bold;
    margin-bottom: 0.6rem;
    margin-top: 2rem;
    display: block;
  }

  .edit-profile input::-webkit-file-upload-button {
    background: #8b6060;
    border: none;
  }

  .edit-profile button {
    background-color: rgb(0, 0, 0);
    margin-top: 1rem;
    position: absolute;
    right: 0;
    padding: 0.8rem 5rem;
    color: aliceblue;
    font-weight: 600;
    border-radius: 10px;
  }

  .edit-profile {
    /* background-color: aquamarine; */
    max-width: 45%;
    margin: 2rem auto;
    position: relative;
    margin-bottom: 5rem;
  }
</style>
<form
  action=""
  method="post"
  enctype="multipart/form-data"
  class="edit-profile"
>
  {% csrf_token %}

  <div>
    <label for="">First Name:</label>
    <input type="text" name="firstname" value="{{user.first_name}}" />
  </div>

  <div>
    <label for="">Last Name:</label>
    <input type="text" name="secondname" value="{{user.last_name}}" />
  </div>

  <div>
    <label for="">User Name:</label>
    <input type="text" name="username" value="{{user.username}}" />
  </div>

  <div>
    <label for="">Bio:</label>
    {{profile.bio}}
  </div>

  <img src="{{profile.profileImage.url}}" alt="alt" />

  <div>
    <label for="">Profile Image:</label>

    {{profile.profileImage}}
  </div>

  <!-- <input type="file"> -->

  <button type="submit">Submit</button>
</form>

{% endblock %}
