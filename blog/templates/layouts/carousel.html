<style>
  @keyframes display {
    0% {
      transform: translateX(200px);
      opacity: 0;
    }
    10% {
      transform: translateX(0);
      opacity: 1;
    }
    20% {
      transform: translateX(0);
      opacity: 1;
    }
    30% {
      transform: translateX(-200px);
      opacity: 0;
    }
    100% {
      transform: translateX(-200px);
      opacity: 0;
    }
  }

  .pic-ctn {
    position: relative;
    width: 100%;
    height: 500px;
    /* background-color: azure; */
    overflow: hidden;
    border-radius: 25px;
  }

  .pic-ctn > a {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    /* left: calc(50% - 100px); */
    opacity: 0;
    animation: display 12s infinite;
    border-radius: 25px;
    display: block;
  }

  .pic {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    border-radius: 25px;
  }

  a:nth-child(2) {
    animation-delay: 4s;
  }
  a:nth-child(3) {
    animation-delay: 8s;
  }
  /* a:nth-child(4) {
    animation-delay: 16s;
  }
  a:nth-child(5) {
    animation-delay: 24s;
  } */
</style>

<div class="pic-ctn">
  {% for post in posts %}

  <a href="{% url 'GET-BLOG' post.slug %}">
    <img src="{{post.image.url}}" alt="" class="pic" />
  </a>

  {% endfor %}
</div>
